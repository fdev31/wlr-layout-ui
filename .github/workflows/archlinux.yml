name: Arch Linux AUR tests

on:
  push:
    branches: [main, 2.x]
  pull_request:
    branches: [main, 2.x]

jobs:
  aur-git:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install base dependencies
        run: pacman -Syu --noconfirm base-devel git python python-build python-installer python-hatchling

      - name: Install X server
        run: sudo pacman -S --noconfirm libxrender xorg-server-xvfb

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install AUR dependecies
        run: |
          useradd -m aur-builder
          mkdir -p /tmp/aur
          chown -R aur-builder:aur-builder /tmp/aur
          echo "aur-builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          su aur-builder -c "git config --global --add safe.directory '${GITHUB_WORKSPACE}'"
          cd /tmp/aur
          git clone "https://aur.archlinux.org/pyglet.git"
          chown -R aur-builder:aur-builder /tmp/aur
          cd pyglet
          su aur-builder -c "makepkg -si --noconfirm"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PKGBUILD from AUR
        run: |
          mkdir -p /tmp/build
          curl -sL "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=wlr-layout-ui-git" -o /tmp/build/PKGBUILD

      - name: Patch PKGBUILD to use local source
        run: |
          sed -i "s|source=(git+https://aur.archlinux.org/wlr-layout-ui-git.git)|source=(\"git+file://${GITHUB_WORKSPACE}\")|" /tmp/build/PKGBUILD
          cat /tmp/build/PKGBUILD

      - name: Build and install with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder /tmp/build
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          su builder -c "git config --global --add safe.directory '${GITHUB_WORKSPACE}'"
          cd /tmp/build
          su builder -c "makepkg -si --noconfirm"

      - name: Verify installation
        run: wlrlui -h
